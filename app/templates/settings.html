{% extends "base.html" %}{% block content %}
<div class="bar"><h1>Datos de la empresa</h1></div>{% if error %}<div class="flash" style="background:#fee2e2;color:#991b1b">El logo debe ser PNG o JPG de menos de 2 MB.</div>{% endif %}{% if saved %}<div class="flash">Guardado.</div>{% endif %}
<form class="card" method="post" action="/settings" enctype="multipart/form-data"><div class="form-grid">
<div><label>Nombre *</label><input name="name" value="{{ company.name }}" required></div><div><label>NIF/CIF</label><input name="tax_id" value="{{ company.tax_id }}"></div>
<div><label>Email</label><input name="email" value="{{ company.email }}"></div><div><label>Teléfono</label><input name="phone" value="{{ company.phone }}"></div>
<div class="full"><label>Dirección fiscal</label><textarea name="address" rows="2">{{ company.address }}</textarea></div>
<div class="full"><label>IBAN (aparece en las facturas)</label><input name="iban" value="{{ company.iban }}"></div>
<div><label>Serie de facturas</label><input name="invoice_series" value="{{ company.invoice_series }}"></div><div><label>Serie de presupuestos</label><input name="quote_series" value="{{ company.quote_series }}"></div>
<div><label>Serie de rectificativas</label><input name="rectify_series" value="{{ company.rectify_series or 'R' }}"></div>
<div class="full"><h2 style="margin:8px 0 0">Imagen de marca</h2></div>
<div><label>Logo (PNG o JPG, máx. 2 MB)</label><input type="file" name="logo" accept="image/png,image/jpeg">
{% if company.logo %}<p><img src="/logo?v={{ brand.logo_version }}" alt="logo" style="max-height:60px;background:#fff;padding:4px;border-radius:6px"><br><label style="display:inline"><input type="checkbox" name="remove_logo" style="width:auto"> Quitar logo</label></p>{% endif %}</div>
<div><label>Color principal (botones, enlaces)</label><input type="color" name="brand_color" value="{{ company.brand_color or '#2563eb' }}" style="height:42px"></div>
<div><label>Color secundario (cabeceras, PDF)</label><input type="color" name="brand_color2" value="{{ company.brand_color2 or '#1f2937' }}" style="height:42px"></div>
<div class="full"></div>
<div><label>IVA por defecto %</label><input name="default_vat" value="{{ company.default_vat }}"></div><div><label>Días de pago por defecto</label><input type="number" name="payment_days" value="{{ company.payment_days }}" min="0"></div></div>
<p><button class="btn primary">Guardar</button></p></form>{% endblock %}
